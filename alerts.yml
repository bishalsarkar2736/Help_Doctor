# Prometheus alerting rules.
#
# This file previously did not exist. Compose mounted ./alerts.yml, so Docker
# created a DIRECTORY of that name, and Prometheus loaded zero rules while
# looking perfectly healthy.
#
# Deliberately few rules. Every alert here should be something a human would
# get out of bed for; a page that fires on noise trains people to ignore the
# ones that matter, which is worse than having no alerting at all.
#
# Metrics are PER PROCESS. Only the api container is scraped, so alerting on
# celery-owned counters (outbox_*, notification workers) would fire forever —
# the api process never increments them. Those need their own exporter before
# they can be alerted on; see docs/MONITORING.md.

groups:
  - name: availability
    rules:
      - alert: APIDown
        # The single most important alert in the system. `up` is synthesised
        # by Prometheus itself, so it fires even when the app is too broken to
        # report anything.
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API is not responding to scrapes"
          description: >-
            Prometheus cannot reach the API's /metrics endpoint. Patients
            cannot book, doctors cannot prescribe. Check
            `docker compose ps api` and its logs.

      - alert: APIMetricsUnscrapeable
        # Distinct from APIDown: the target resolves but returns non-200,
        # which in production usually means METRICS_TOKEN is set on the API
        # while Prometheus is not sending it (the endpoint then 401s, or 404s
        # when the token is unset entirely).
        expr: up{job="fastapi"} == 0 and on() (time() - process_start_time_seconds{job="prometheus"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API metrics have been unreachable for 10 minutes"
          description: >-
            If the API itself is healthy, check METRICS_TOKEN and the
            bearer_token_file setting in prometheus.yml.

  - name: errors
    rules:
      - alert: HighServerErrorRate
        # The alert that was impossible before http_requests_total existed:
        # the latency histogram said how long requests took but not whether any
        # of them failed, so a deploy that 500s every write looked healthy.
        #
        # clamp_min guards the divide-by-zero on an idle system, which would
        # otherwise evaluate to NaN and never fire.
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 1% of requests are returning 5xx"
          description: >-
            {{ $value | humanizePercentage }} of requests are failing. Check
            the most recent deploy first — this is usually a release, not load.

      - alert: EndpointServerErrors
        # Per-route, so a single broken endpoint is visible even when it is too
        # small a share of total traffic to move the global rate above 1%.
        expr: sum by (path) (rate(http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint {{ $labels.path }} is returning 5xx"
          description: >-
            Sustained server errors on a single route. The global error rate
            may still look fine.

      - alert: PaymentEndpointErrors
        # Money path: a failure here costs the clinic a booking AND the patient
        # their slot, so it is escalated regardless of volume.
        expr: >-
          sum(rate(http_requests_total{path=~"/payments.*", status=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Payment endpoints are returning 5xx"
          description: >-
            Patients cannot pay. Check the gateway and app.services.payment
            logs before assuming an application bug.

      - alert: NoTrafficReceived
        # A silent API is indistinguishable from a healthy one on a rate graph.
        # `up` stays 1 while nginx cannot reach the backend, which is exactly
        # how a stale upstream IP hid a total outage once already.
        #
        # THE PATH FILTER IS THE ALERT. Without it this rule could never fire:
        # Prometheus scrapes /metrics every 15s and Docker probes /health/live
        # every 30s, and both are counted by the same middleware. Measured on the
        # running stack with zero real users:
        #
        #   sum(rate(http_requests_total[10m]))            = 0.30   (never 0)
        #   ... {path!~"/metrics|/health|/health/(live|ready)"} = no data
        #
        # So the unfiltered rule was watching its own monitoring traffic, and a
        # total loss of user traffic would have produced no alert at all.
        #
        # <unmatched> is excluded too: it is the bucket for requests that hit no
        # route, which on a public address is mostly scanner noise -- background
        # radiation that would mask exactly the outage this rule exists to catch.
        #
        # The regex is anchored by PromQL, and spelled out rather than as
        # `/health.*`, so an application route like /health-records keeps
        # counting as real traffic.
        #
        # The `absent()` arm covers the case the `== 0` arm cannot: when no real
        # request has EVER been served, the filtered series do not exist, and an
        # empty vector compared to 0 is still empty -- silence again, in a new
        # form.
        expr: >-
          sum(rate(http_requests_total{path!~"/metrics|/health|/health/(live|ready)|<unmatched>"}[10m])) == 0
          or
          absent(http_requests_total{path!~"/metrics|/health|/health/(live|ready)|<unmatched>"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API has served no requests for 15 minutes"
          description: >-
            Either genuinely idle, or nothing can reach it. Check the web tier
            and the proxy upstream before assuming it is quiet.

  - name: background_jobs
    rules:
      - alert: CeleryWorkerDown
        # Background jobs used to fail completely silently: nothing scraped the
        # worker, so appointment reminders, slot generation, payment
        # reconciliation and the PHI retention purge could all stop and the
        # only trace would be a log line nobody reads.
        # Both selectors are scoped to job="celery" — WITHOUT that scope this
        # alert fires forever. The api process imports app.core.celery to
        # enqueue tasks, which defines these gauges at import time, so the api
        # ALSO exports celery_worker_up. It is never incremented there
        # (worker_ready only fires in the worker), so it sits at 0 and an
        # unscoped `celery_worker_up < 1` matches it permanently — paging
        # someone about a worker that is demonstrably healthy.
        expr: up{job="celery"} == 0 or celery_worker_up{job="celery"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Celery worker is running"
          description: >-
            Appointment reminders, slot generation, payment reconciliation and
            PHI log retention have all stopped. Patients still book; nothing
            scheduled happens.

      - alert: OutboxWorkerDown
        # The dispatcher between publishing an event and anything happening
        # because of it: in-app notifications, email, WhatsApp, appointment
        # reminders. It had no service at all for weeks, and no alert could have
        # said so, because nothing scraped it.
        #
        # LIVENESS: the process is gone or unreachable. Whether a live worker is
        # doing anything is OutboxWorkerStalled, below.
        expr: up{job="outbox_worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The outbox worker is not running"
          description: >-
            Domain events are still being written to outbox_events and nothing
            is draining them. In-app notifications, email, WhatsApp and
            appointment reminders have all stopped, silently.

      - alert: OutboxWorkerStalled
        # PROGRESS, not liveness. The process can be up, its metrics port
        # answering and its container healthcheck green while the poll loop is
        # wedged -- blocked on a lock, or stuck on an event it can neither
        # complete nor fail. An aborted transaction did exactly that: one event
        # became immortal and the loop retried it forever.
        #
        # The loop refreshes this gauge at the top of every poll and
        # POLL_INTERVAL is 5s, so 120s is twenty-four missed polls: well outside
        # jitter, and loose enough that a slow batch does not page anyone.
        expr: time() - outbox_worker_heartbeat{job="outbox_worker"} > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The outbox worker is alive but has stopped polling"
          description: >-
            The process is up and scrapeable, but its loop has not completed a
            pass in over two minutes. Events are accumulating unprocessed.

      - alert: CeleryWorkerNotExecuting
        # The failure `celery inspect ping` could not see. When the prefork pool
        # cannot start a task -- it exhausted its file descriptors and rejected
        # every one with [Errno 24] -- the parent still answers ping, the
        # container still reports healthy, and nothing runs.
        #
        # So this asks about COMPLETIONS rather than about the process. That is
        # only a sound question because beat dispatches appointment-reminder-job
        # every 60 seconds unconditionally: this system is never legitimately
        # idle for fifteen minutes, so a flat completion count is an anomaly
        # rather than a quiet period.
        #
        # Paired with a live worker so it cannot double-fire with
        # CeleryWorkerDown.
        expr: >-
          celery_worker_up{job="celery"} >= 1
          and increase(celery_tasks_total{job="celery"}[15m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Celery worker is alive but has executed nothing"
          description: >-
            The worker is up and answering, and no task has completed in fifteen
            minutes while beat schedules one every minute. Check for rejected
            tasks -- file descriptor exhaustion produces exactly this.

      - alert: CeleryBeatNotDispatching
        # Distinguished from CeleryWorkerNotExecuting by the QUEUE. A wedged
        # worker leaves tasks piling up in Redis; a dead beat leaves nothing to
        # pile up. Same silence, opposite queue depth, different thing to fix.
        expr: >-
          celery_worker_up{job="celery"} >= 1
          and increase(celery_tasks_total{job="celery"}[15m]) == 0
          and celery_queue_length{job="celery"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery beat appears to have stopped scheduling"
          description: >-
            No task has completed in fifteen minutes and the queue is empty, so
            nothing is being dispatched. Beat runs as its own container with no
            healthcheck; check that it is still up.

      - alert: CeleryTaskFailures
        # Scoped for the same reason as CeleryWorkerDown: the api exports these
        # names too, at zero.
        expr: sum by (task) (rate(celery_tasks_total{job="celery", state="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery task {{ $labels.task }} is failing"
          description: >-
            Sustained failures. Check the worker logs for the traceback — the
            task may be retrying and eventually dead-lettering.

      - alert: CeleryQueueBacklog
        # Read live from the broker on scrape, so this still reports correctly
        # when the workers are wedged and consuming nothing.
        expr: celery_queue_length{job="celery"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue has {{ $value }} messages waiting"
          description: >-
            Work is arriving faster than it is being consumed, or the workers
            are stuck. Check CeleryWorkerDown first.

      - alert: CeleryTasksSlow
        expr: >-
          histogram_quantile(0.95,
            sum by (le, task) (rate(celery_task_duration_seconds_bucket{job="celery"}[15m]))
          ) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Celery task {{ $labels.task }} p95 above 5 minutes"
          description: >-
            Long-running tasks hold a prefork child each, so a few slow ones
            starve everything else queued behind them.

  - name: latency
    rules:
      - alert: HighAPILatency
        # p95 across all endpoints. The histogram carries no route label, so
        # this cannot be broken down further without adding one — noted in
        # docs/MONITORING.md as an instrumentation gap.
        expr: histogram_quantile(0.95, sum(rate(api_request_latency_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile API latency above 1s"
          description: >-
            Sustained slow responses. Check database connection pool
            saturation and slow queries before assuming load.

  - name: security
    rules:
      - alert: LoginFailureSpike
        # Brute force / credential stuffing. The login endpoint is rate
        # limited at 5/min per client, so a sustained high rate means many
        # sources, not one retrying user.
        expr: sum(rate(login_attempts_total{result="failure"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated login failure rate"
          description: >-
            More than 1 failed login per second sustained for 5 minutes.
            Check audit_logs for event_type='security', action='login_failure'
            and consider whether a source needs blocking.

      - alert: LoginFailureMajority
        # Different signal from the rate: when MOST attempts fail, something
        # is broken (an outage in the identity path) or under attack. Guarded
        # against divide-by-zero on an idle system.
        expr: >-
          sum(rate(login_attempts_total{result="failure"}[15m]))
          /
          clamp_min(sum(rate(login_attempts_total[15m])), 0.001)
          > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Over 80% of login attempts are failing"
          description: >-
            Either an attack, or authentication is broken for legitimate
            users. Check recent deploys before assuming the former.

  - name: money
    rules:
      - alert: PaymentFailures
        # Payments are the one place a silent failure costs the clinic money
        # directly and the patient loses their booking.
        expr: increase(payments_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Payment failures recorded"
          description: >-
            {{ $value }} payment(s) failed in the last 15 minutes. Check the
            gateway status and app.services.payment logs.

  - name: data
    rules:
      - alert: DatabaseRetries
        # db_retry_total incrementing means the app is retrying transactions —
        # deadlocks, serialisation failures or a flapping connection. It
        # usually precedes a visible outage.
        expr: increase(db_retry_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database transactions are being retried"
          description: >-
            More than 5 retries in 10 minutes. Check Postgres logs for
            deadlocks and connection saturation (DB_POOL_SIZE budget is
            documented in app/config.py).

      - alert: DoubleBookingContention
        # The guard working is good; the guard working OFTEN means slot
        # allocation is racing more than it should.
        expr: increase(doctor_double_booking_prevented_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent double-booking attempts blocked"
          description: >-
            The integrity constraint is doing its job, but this rate suggests
            the booking UI is offering slots it should already know are taken.

  # ---------------------------------------------------------------------------
  # The alerting pipeline itself. Every other rule in this file assumes that a
  # firing alert reaches a human; nothing until now checked that assumption.
  #
  # Measured on this deployment before these rules existed:
  #
  #   alertmanager_alerts_received_total{status="firing"}          34
  #   alertmanager_notifications_total{integration="webhook"}      10
  #   alertmanager_notifications_failed_total{...clientError}      10
  #
  # Ten out of ten notifications failed with "unexpected status code 404", among
  # them CeleryWorkerDown and OutboxWorkerDown -- real alerts about background
  # workers, fired correctly, delivered to nobody. Alertmanager was up, its API
  # answered, and Prometheus reported zero send errors, because the failure is on
  # the LAST hop and nothing scraped Alertmanager to see it.
  #
  # KNOWN LIMIT, stated because it decides how much these rules are worth: an
  # alert about broken delivery is itself delivered by the thing it reports
  # broken. These make the failure visible in the Prometheus UI, Grafana and the
  # firing history, which is where it was invisible before -- they cannot page
  # through a path that is down. Closing that needs a dead-man's-switch routed to
  # an external service, which is deliberately not this milestone.
  # ---------------------------------------------------------------------------
  - name: alerting_pipeline
    rules:
      - alert: AlertmanagerNotificationsFailing
        # THE ONE THAT WOULD HAVE CAUGHT THE 10/10. `by (integration)` so the
        # message names which delivery path is broken rather than just that one
        # is.
        #
        # Alertmanager retries before counting an attempt failed, and a transient
        # 5xx recovers on its own, so `for: 10m` keeps a blip from paging while
        # an unrecoverable clientError -- a wrong URL, a revoked webhook, an
        # unreadable credential -- persists and fires.
        expr: sum by (integration) (rate(alertmanager_notifications_failed_total{job="alertmanager"}[15m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cannot deliver {{ $labels.integration }} notifications"
          description: >-
            Alerts are firing and reaching Alertmanager, and its notifications to
            this integration are failing. Every other alert in this file is
            currently going nowhere. Check the receiver URL or credential, and
            the Alertmanager log for the exact status code.

      - alert: AlertmanagerDown
        # `absent()` for the same reason NoTrafficReceived needs it: if the
        # scrape job is removed or renamed, up{job="alertmanager"} has no series
        # at all, and an empty vector compared to 0 is still empty -- the rule
        # that reports the alerting pipeline broken would itself go quiet.
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down or not being scraped"
          description: >-
            Prometheus rules still evaluate, but nothing routes, groups,
            deduplicates or delivers what they produce. If this fires because the
            scrape job disappeared, alerting is unmonitored rather than down.

      - alert: AlertmanagerConfigReloadFailed
        # A rejected reload leaves the PREVIOUS config running, so the deploy
        # looks successful and the change silently did not happen.
        expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager rejected its configuration"
          description: >-
            The last reload failed and Alertmanager kept the configuration it had
            before it. Routing and receivers are not what the config file says.
            Check `amtool check-config` and the Alertmanager log.

  # ---------------------------------------------------------------------------
  # THE DEAD-MAN'S SWITCH.
  #
  # Every other rule in this file is evaluated BY Prometheus, so every other rule
  # shares one blind spot: if Prometheus stops -- crashed, OOM-killed, host down,
  # network partitioned, container never restarted after a reboot -- all 23 of
  # them stop evaluating at the same instant and the system goes perfectly
  # silent. Silence is indistinguishable from health. That is the failure this
  # rule exists for, and nothing inside this stack can detect it, because
  # anything inside the stack dies with it.
  #
  # The signal is therefore INVERTED. Watchdog fires permanently and is delivered
  # continuously to an external heartbeat monitor; that monitor alerts when the
  # stream STOPS. Absence becomes the alarm, and the alarm lives on infrastructure
  # that does not share fate with this host.
  #
  # `vector(1)` depends on no metric, no scrape target and no series -- it is true
  # even against a completely empty TSDB, which is exactly the state after a
  # restart or a data loss. Verified by promtool at eval_time 0m with
  # `input_series: []`.
  #
  # It is ROUTED, not silenced: alertmanager.yml sends severity=watchdog to a
  # dedicated receiver and nowhere else. It must never reach a human receiver --
  # a permanently-firing page trains people to ignore the ones that matter, which
  # is the failure the top of this file warns about.
  # ---------------------------------------------------------------------------
  - name: watchdog
    rules:
      - alert: Watchdog
        # Always firing, on purpose. An alert that is quiet when healthy cannot
        # distinguish "healthy" from "dead".
        expr: vector(1)
        for: 0m
        labels:
          severity: watchdog
        annotations:
          summary: "Monitoring pipeline is alive (dead-man's switch)"
          description: >-
            This alert always fires and is delivered to an external heartbeat
            monitor. Seeing it is normal. If the external monitor stops receiving
            it, Prometheus or Alertmanager has stopped, the host is down, or the
            network to the monitor is broken -- and no other alert in this file
            can tell you, because they all depend on the system that stopped.
