# Alertmanager routing for PRODUCTION.
#
# The default alertmanager.yml posts to MailHog, which is a development
# placeholder: it proves the delivery path works locally and reaches nobody.
# This file is what actually pages a human.
#
# Select it by setting ALERTMANAGER_CONFIG before `docker compose up`:
#
#   ALERTMANAGER_CONFIG=./alertmanager.production.yml docker compose up -d alertmanager
#
# NO CREDENTIALS IN THIS FILE. It is committed, and a password written here is
# a published password — the same mistake that put a live database password in
# alembic.ini. Alertmanager supports a `_file` variant for every secret, so the
# values live in ./secrets/ (gitignored) and are mounted read-only:
#
#   mkdir -p secrets
#   printf '%s' 'your-smtp-password'      > secrets/smtp_password
#   printf '%s' 'https://hooks.slack...'  > secrets/slack_webhook
#   chmod 600 secrets/*
#
# Then verify BEFORE deploying — a config error here means silence, which looks
# exactly like "no alerts firing":
#
#   docker run --rm -v "$PWD:/w" --entrypoint amtool prom/alertmanager \
#     check-config /w/alertmanager.production.yml

global:
  resolve_timeout: 5m

  # SMTP defaults, inherited by every email_config below.
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m

  # Do not re-send a firing alert more often than this. Too short and people
  # mute the channel; too long and a real incident goes quiet.
  repeat_interval: 4h

  receiver: oncall-email

  routes:
    # Critical = get out of bed. The API is down, payments are failing, or no
    # Celery worker is running. Notified faster and repeated more often.
    - matchers:
        - severity = "critical"
      receiver: oncall-critical
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # When the API is down it will also be slow and erroring. Suppress the
  # downstream noise so the page says one useful thing instead of five.
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - severity = "warning"
    equal: ["job"]

receivers:
  - name: oncall-email
    email_configs:
      - to: "oncall@example.com"
        send_resolved: true

  - name: oncall-critical
    email_configs:
      - to: "oncall@example.com"
        send_resolved: true
    # Second channel on purpose: email is the one that gets filtered, delayed,
    # or read in the morning. A critical alert should arrive somewhere with a
    # notification sound.
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        channel: "#oncall"
        send_resolved: true
        title: '{{ .status | toUpper }}: {{ .commonLabels.alertname }}'
        text: >-
          {{ range .alerts }}{{ .annotations.summary }}
          {{ .annotations.description }}
          {{ end }}
