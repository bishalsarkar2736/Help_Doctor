# Alertmanager routing for PRODUCTION.
#
# The default alertmanager.yml posts to MailHog, which is a development
# placeholder: it proves the delivery path works locally and reaches nobody.
# This file is what actually pages a human.
#
# Select it by setting ALERTMANAGER_CONFIG before `docker compose up`:
#
#   ALERTMANAGER_CONFIG=./alertmanager.production.yml docker compose up -d alertmanager
#
# NO CREDENTIALS IN THIS FILE. It is committed, and a password written here is
# a published password — the same mistake that put a live database password in
# alembic.ini. Alertmanager supports a `_file` variant for every secret, so the
# values live in ./secrets/ (gitignored) and are mounted read-only:
#
#   mkdir -p secrets
#   printf '%s' 'your-smtp-password'      > secrets/smtp_password
#   printf '%s' 'https://hooks.slack...'  > secrets/slack_webhook
#   chmod 644 secrets/*
#
# 644, NOT 600 — and this line used to say 600, which is the whole reason the
# check exists. This container runs as nobody (uid 65534), so a 0600 file owned
# by the deploying user is unreadable to it. Alertmanager still starts, amtool
# still reports SUCCESS, alerts still show as firing, and every notification
# dies at send time with "permission denied". Measured: 54 attempts, 54
# failures, nothing delivered. On a host with untrusted local users, prefer
# `chown 65534 secrets/* && chmod 600 secrets/*` instead.
#
# Then verify BEFORE deploying — a config error here means silence, which looks
# exactly like "no alerts firing":
#
#   docker run --rm -v "$PWD:/w" --entrypoint amtool prom/alertmanager \
#     check-config /w/alertmanager.production.yml

global:
  resolve_timeout: 5m

  # SMTP defaults, inherited by every email_config below.
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m

  # Do not re-send a firing alert more often than this. Too short and people
  # mute the channel; too long and a real incident goes quiet.
  repeat_interval: 4h

  receiver: oncall-email

  routes:
    # THE DEAD-MAN'S SWITCH, first and terminal.
    #
    # Watchdog fires permanently (alerts.yml, group `watchdog`) and must reach
    # the external heartbeat monitor and nobody else. `continue` defaults to
    # false, so matching here stops evaluation: it never reaches
    # oncall-critical, never reaches oncall-email, never wakes anyone.
    #
    # One minute between pings against a monitor configured to alarm after
    # several -- the heartbeat has to be comfortably faster than the window it
    # is beating, or an ordinary delay pages you.
    - matchers:
        - severity = "watchdog"
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Critical = get out of bed. The API is down, payments are failing, or no
    # Celery worker is running. Notified faster and repeated more often.
    - matchers:
        - severity = "critical"
      receiver: oncall-critical
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # When the API is down it will also be slow and erroring. Suppress the
  # downstream noise so the page says one useful thing instead of five.
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - severity = "warning"
    equal: ["job"]

receivers:
  - name: oncall-email
    email_configs:
      - to: "oncall@example.com"
        send_resolved: true

  - name: oncall-critical
    email_configs:
      - to: "oncall@example.com"
        send_resolved: true
    # Second channel on purpose: email is the one that gets filtered, delayed,
    # or read in the morning. A critical alert should arrive somewhere with a
    # notification sound.
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        channel: "#oncall"
        send_resolved: true
        title: '{{ .status | toUpper }}: {{ .commonLabels.alertname }}'
        text: >-
          {{ range .alerts }}{{ .annotations.summary }}
          {{ .annotations.description }}
          {{ end }}

  # The dead-man's switch. The only receiver whose job is to be pinged when
  # everything is FINE.
  #
  # The URL is the credential: anyone holding it can ping the monitor and
  # suppress the alarm, so it is read from the mounted secret directory exactly
  # like the SMTP password and the Slack webhook above -- never inline, because
  # this file is committed.
  #
  # scripts/check_production_env.py derives this path from THIS file (it collects
  # every *_file value it finds, at any nesting depth), so the deploy gate
  # already requires secrets/watchdog_url to exist, to be a regular file, and to
  # be readable by uid 65534. No extra validation was needed.
  #
  # send_resolved is false: a heartbeat has no resolved state, and a "resolved"
  # ping would tell the monitor the opposite of what it means.
  #
  # Create the file at deployment time -- see docs/DEPLOYMENT.md. It is NOT in
  # this repository and must never be.
  - name: watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/watchdog_url
        send_resolved: false
