version: "3.9"

# Bounded, rotated, compressed container logs (the `local` driver compresses
# rotated files automatically). 5 x 10 MB = 50 MB retained per container, so
# logs can never fill the disk.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  # api, migrate, celery_worker and celery_beat all run the SAME Dockerfile, so
  # they share one image tag. Without an explicit `image:`, compose derives a
  # separate tag per service and `docker compose build api` leaves the other
  # three on older code — including the migration runner, which then applies a
  # different set of revisions than the app expects. Keep the tag identical on
  # all four.
  #
  # One-shot: apply DB migrations, then exit. Everything that touches the DB
  # waits for this to finish, so migrations run exactly once per release and
  # multiple api/worker replicas never race to migrate.
  migrate:
    build: .
    image: helpdoctor-app:local
    container_name: helpdoctor_migrate
    # Migrate, then PROVE the result before anything is allowed to serve.
    #
    # api, celery_worker, celery_beat and outbox_worker all wait on this
    # service completing successfully, so a non-zero exit here -- from the
    # upgrade or from the verification -- stops the whole application from
    # starting. That ordering already existed; putting the check inside this
    # command is what extends it from "migrations ran" to "the schema is the
    # one this code expects", in production and staging alike.
    #
    # `&&` matters: verification runs only if the upgrade succeeded, and the
    # container's exit status is the first failure either way.
    command: sh -c 'alembic upgrade head && python -m scripts.verify_schema'
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: helpdoctor-app:local
    container_name: helpdoctor_api
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # Frontend SPA served by nginx (built from the sibling repo). VITE_API_URL is
  # baked in at build time — point it at the public API origin in production.
  web:
    build:
      context: ../helpdoctor-frontend
      args:
        # Vite inlines these at BUILD time, so they must be build args — a
        # runtime env var on the container has no effect. All three are public
        # values (they ship inside the browser bundle anyway). Override per
        # environment by exporting them before `docker compose build`.
        # NOTE: deliberately NOT sourced from .env — that file is the backend's
        # own config and its Settings model rejects unknown keys.
        # Relative on purpose: nginx proxies /api/ to the api service on the
        # same origin, so the browser makes no cross-origin request and the CSP
        # can name connect-src 'self'. Override with an absolute origin only if
        # the API really is on another host — and then widen connect-src in
        # nginx.conf to match, or every request is blocked.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-339449117887-g6n4qn68ofspacja5bvl7l86u4elmhbc.apps.googleusercontent.com}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-BKbGoq0W2_ReS1ep6dFOOGikg1Y-wfpXIqUJ0CktdD6zifotRnR5tKny5Nyb8UU8gGS-2NTySVCR8rPHTClZE08}
    container_name: helpdoctor_web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

  celery_worker:
    build: .
    image: helpdoctor-app:local
    container_name: helpdoctor_celery_worker
    # Concurrency is NOT set here: it lives in app/core/celery.py, driven by
    # CELERY_WORKER_CONCURRENCY, so the limit holds no matter how the worker is
    # started. A --concurrency flag would override that config and give two
    # places to keep in sync.
    # The multiprocess directory is cleared BEFORE python starts. Doing it
    # later — from a Celery signal, say — unlinks mmap files whose handles are
    # already open, and every metric silently reads 0 from then on.
    command: >-
      sh -c 'rm -f "$${PROMETHEUS_MULTIPROC_DIR}"/*.db 2>/dev/null;
      exec celery -A app.core.celery worker --loglevel=info'
    env_file:
      - .env.docker
    environment:
      # Multiprocess mode, set ONLY here. Task signals fire in the prefork
      # CHILDREN while the metrics HTTP server runs in the parent, so without
      # this every counter would export zero and a dead worker would look
      # identical to an idle one. The api is a single process and must NOT have
      # this set — it would change how its own /metrics endpoint collects.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      CELERY_METRICS_PORT: "9100"
    tmpfs:
      # tmpfs, not a volume: these are mmap'd scratch files that must not
      # survive a restart. Stale files from dead workers get aggregated into
      # the next run's totals, so counters jump and worker_up counts processes
      # that no longer exist. The startup cleanup is a second line of defence.
      #
      # mode=1777 is stated rather than inherited. Docker applies a tmpfs's
      # default 1777 only when it CREATES the container; every later start of
      # the SAME container — `compose restart`, a restart-policy restart after
      # a crash, a daemon restart, a host reboot — remounts it 755 root:root.
      # The non-root `app` user then cannot create gauge_livesum_1.db, the
      # worker exits 2, and `unless-stopped` restarts it into the same broken
      # mount: a permanent crash loop that only recreation escapes. Measured on
      # one container: boot 1 = 1777 writable, boots 2-6 = 755 denied.
      #
      # Still no uid/gid, deliberately. mode alone is sufficient — the mount
      # stays root-owned and world-writable, and uid 999 writes to it. Pinning
      # uid=999 would hard-code a number that lives in the Dockerfile's
      # useradd and break the mount silently the day it changed.
      - /tmp/prometheus_multiproc:mode=1777
    # Celery prefork needs far more descriptors than the daemon's default soft
    # limit of 1024, and this container inherits that default. With 1024 the four
    # pool children exhaust it during pool setup and every task is rejected with
    # "[Errno 24] Too many open files" before its body runs — the worker looks
    # healthy and silently executes nothing. Measured: at 65536 the whole pool
    # sits under 100 descriptors, so this is headroom, not a leak being papered
    # over.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Override the image's HTTP healthcheck — this service runs no web server.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
    restart: unless-stopped
    logging: *default-logging

  celery_beat:
    build: .
    image: helpdoctor-app:local
    container_name: helpdoctor_celery_beat
    command: celery -A app.core.celery beat --loglevel=info
    env_file:
      - .env.docker
    # beat has no web server and no inspectable worker — disable the inherited
    # HTTP healthcheck rather than report a permanently false "unhealthy".
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # The outbox dispatcher: the process that turns published events into
  # notifications. It had no service at all, which is why outbox_events
  # accumulated `pending` for weeks and nothing downstream of an event — in-app
  # notifications, email, WhatsApp, appointment reminders — ever ran outside the
  # tests. Publishing was correct; nothing consumed it.
  #
  # A SEPARATE SERVICE, not a thread in the api. It restarts, scales and fails on
  # its own, and an api deploy does not interrupt a batch mid-flight.
  #
  # NOT a Celery worker. It is a plain asyncio poll loop (POLL_INTERVAL = 5s) with
  # its own claiming, retry backoff, stuck-event recovery and dead-lettering; it
  # uses Celery only in the sense that a handler may enqueue a push task. So no
  # -A flag, no queues, and deliberately none of celery_worker's
  # PROMETHEUS_MULTIPROC_DIR/tmpfs setup: that is prefork-only machinery, and a
  # single-process loop has no pool children whose metrics need aggregating.
  # This service exports its own metrics directly instead.
  outbox_worker:
    build: .
    image: helpdoctor-app:local
    container_name: helpdoctor_outbox_worker
    # -m, so the package is imported the same way the tests import it and
    # __name__ == "__main__" reaches asyncio.run(main()).
    command: python -m app.workers.run_outbox_worker
    env_file:
      - .env.docker
    # The same three the api waits for. Postgres because the loop selects and
    # advances outbox rows; Redis because the dispatch path uses it for the
    # notification cooldown, the push-enqueue idempotency claim and as the Celery
    # broker when a handler enqueues a push. Nothing else is required, so nothing
    # else is depended on.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Internal only — deliberately not published to the host. Prometheus
      # scrapes it over the compose network.
      OUTBOX_METRICS_PORT: "9103"
    # LIVENESS, and only liveness: the process is up and its metrics server
    # answers. It does NOT prove the poll loop is turning — /metrics is served
    # from a separate thread and would keep answering a wedged loop.
    #
    # Progress is a different question, answered by Prometheus from
    # outbox_worker_heartbeat, which the loop refreshes on every poll. Docker
    # healthchecks cannot express "has made progress recently" without embedding
    # a threshold in a shell one-liner, and that belongs in an alert rule beside
    # the others.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9103/metrics > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # No ports. Nothing about this process is reachable from outside the network,
    # and it needs nothing published to do its work.
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16
    container_name: helpdoctor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback, NOT 0.0.0.0. This database holds patient records;
      # publishing it on every interface exposed it to the whole network, and
      # docker's port publishing bypasses a host firewall's INPUT chain, so a
      # ufw/iptables rule does not cover it. Host tooling (alembic, the e2e
      # seeder, psql) reaches it on localhost:5433 exactly as before.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  db_backup:
    image: postgres:16
    container_name: helpdoctor_db_backup
    env_file:
      - .env.docker
    environment:
      # pg_dump talks to the postgres service, not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "3600"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/backup_db.sh:/backup_db.sh:ro
      - db_backups:/backups
    entrypoint: >-
      bash -c 'while true; do /backup_db.sh || echo "backup failed";
      sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    restart: unless-stopped
    logging: *default-logging

  # Backs up the object storage bucket. db_backup covers Postgres only, so
  # without this a database restore returns the doctor_documents row and its
  # storage key but not the credential document itself.
  files_backup:
    image: minio/mc:latest
    container_name: helpdoctor_files_backup
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-helpdoctor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-helpdoctor_minio_dev}
      S3_BUCKET: ${S3_BUCKET:-helpdoctor}
      BACKUP_DIR: /backups/objects
      RETENTION_SNAPSHOTS: "28"
      # Every 6 hours, not hourly: each snapshot is a FULL mirror (mc does not
      # dedupe across directories) and these files change rarely. 28 snapshots
      # at this interval is roughly a week, matching the database retention.
      BACKUP_INTERVAL_SECONDS: "21600"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/backup_files.sh:/backup_files.sh:ro
      - db_backups:/backups
    entrypoint: >-
      sh -c 'while true; do /backup_files.sh || echo "object backup failed";
      sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    restart: unless-stopped
    logging: *default-logging

  # Copies local backups to an OFFSITE target. Disabled by default because it
  # cannot work without credentials for somewhere that is genuinely elsewhere:
  #
  #   docker compose --profile offsite up -d offsite_backup
  #
  # Until this runs, the database and every backup of it live on one machine —
  # a copy, not a backup.
  offsite_backup:
    image: minio/mc:latest
    container_name: helpdoctor_offsite_backup
    profiles: ["offsite"]
    environment:
      OFFSITE_ENDPOINT_URL: ${OFFSITE_ENDPOINT_URL:-}
      OFFSITE_ACCESS_KEY: ${OFFSITE_ACCESS_KEY:-}
      OFFSITE_SECRET_KEY: ${OFFSITE_SECRET_KEY:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_PREFIX: ${OFFSITE_PREFIX:-helpdoctor}
      BACKUP_DIR: /backups
      # Every 6 hours. More often buys little: the database dump runs hourly
      # and the objects change rarely.
      OFFSITE_INTERVAL_SECONDS: "21600"
    volumes:
      - ./scripts/backup_offsite.sh:/backup_offsite.sh:ro
      # Read-only: this container ships backups out, it has no business
      # modifying them.
      - db_backups:/backups:ro
    entrypoint: >-
      sh -c 'while true; do /backup_offsite.sh || echo "offsite sync failed";
      sleep "$${OFFSITE_INTERVAL_SECONDS}"; done'
    restart: unless-stopped
    logging: *default-logging

  # S3-compatible object storage. Required before running more than one api
  # replica: with STORAGE_BACKEND=local an upload lands on one replica's disk
  # and a download served by another is a 404.
  #
  # Console on :9001. Same boto3 code path as real S3 — moving to AWS/R2 is a
  # change of S3_ENDPOINT_URL and credentials, not of code.
  minio:
    image: minio/minio:latest
    container_name: helpdoctor_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-helpdoctor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-helpdoctor_minio_dev}
    ports:
      # Loopback only. This holds doctor credential documents and patient
      # signatures; docker publishes past the host firewall's INPUT chain, so
      # 0.0.0.0 would expose them to the network.
      #
      # Published on 9101/9102 rather than MinIO's usual 9000/9001: portainer
      # and prometheus-node-exporter commonly hold those, and a bind failure
      # aborts `docker compose up` for the whole stack. Containers still reach
      # it as minio:9000 over the compose network — only the host port moves.
      - "127.0.0.1:9101:9000"
      - "127.0.0.1:9102:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # One-shot: create the bucket, then exit. Runs on every `up` and is a no-op
  # when the bucket already exists.
  minio_init:
    image: minio/mc:latest
    container_name: helpdoctor_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-helpdoctor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-helpdoctor_minio_dev}
      S3_BUCKET: ${S3_BUCKET:-helpdoctor}
    entrypoint: >-
      sh -c 'mc alias set hd http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
      mc mb --ignore-existing "hd/$${S3_BUCKET}" &&
      echo "bucket $${S3_BUCKET} ready"'
    restart: "no"

  redis:
    image: redis:7
    container_name: helpdoctor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Dev-only SMTP catcher. Captures every outgoing email (OTP codes, invitation
  # links, password resets) instead of delivering it, so flows are testable
  # without real deliverability. Web inbox: http://localhost:8025
  # NOT for production — mail is stored in memory and never actually sent.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: helpdoctor_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    restart: unless-stopped
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: helpdoctor_jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped
    logging: *default-logging

  # Routes firing alerts to a human. Without it the rules in alerts.yml
  # evaluate and fire into the void — visible only on Prometheus's own page,
  # which nobody is watching at 3am.
  alertmanager:
    image: prom/alertmanager
    container_name: helpdoctor_alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      # Defaults to the dev config (MailHog — reaches nobody). Point at the
      # production one to actually page a human:
      #   ALERTMANAGER_CONFIG=./alertmanager.production.yml docker compose up -d
      - ${ALERTMANAGER_CONFIG:-./alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      # SMTP password and Slack webhook, referenced by the *_file directives in
      # the production config. Gitignored — a credential in a committed file is
      # a published credential.
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus
    container_name: helpdoctor_prometheus
    ports:
      # Published on 9091, not 9090: a distro-packaged prometheus commonly runs
      # as a host service on 9090, and the resulting bind failure aborts
      # `docker compose up` for the WHOLE stack — api included. Only the host
      # port moves; scrape targets and Grafana reach this container over the
      # compose network on 9090, so nothing internal changes.
      # Loopback: metrics describe internals (queue depths, failure counts) and
      # /metrics itself is unauthenticated when METRICS_TOKEN is unset.
      - "127.0.0.1:9091:9090"
    volumes:
      # :ro so a stray container write cannot mangle them. Both MUST exist as
      # files on the host — docker silently creates a DIRECTORY for a missing
      # bind-mount source, which is how alerts.yml became an empty directory
      # and Prometheus loaded zero rules while appearing healthy.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana
    container_name: helpdoctor_grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging


volumes:
  postgres_data:
  alertmanager_data:
  minio_data:
  uploads_data:
  media_data:
  db_backups:

