global:
  scrape_interval: 5s

rule_files:
  - "monitoring/alerts.yml"

scrape_configs:
  - job_name: "fastapi"
    # In production, METRICS_TOKEN must be set on the API and this
    # scrape config must supply it, e.g.:
    # bearer_token: "<same value as METRICS_TOKEN>"
    static_configs:
      - targets: ["localhost:8000"]