global:
  # 5s was fine for a demo but writes a lot of samples for no benefit — every
  # alert here needs `for: 1m` or longer. 15s is the usual default.
  scrape_interval: 15s
  evaluation_interval: 15s

# Path is relative to Prometheus's working directory (/etc/prometheus) and must
# match where compose mounts the file. This previously said
# "monitoring/alerts.yml" while compose mounted /etc/prometheus/alerts.yml, so
# no rules were ever loaded and Prometheus reported zero rule groups.
rule_files:
  - "alerts.yml"

# Without this, rules evaluate and fire into the void: Prometheus shows them as
# firing on its own dashboard and nobody is ever told.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "fastapi"
    # `api:8000`, NOT `localhost:8000`. Inside the Prometheus container,
    # localhost is Prometheus itself — the old target sat permanently DOWN
    # with "connection refused" while Grafana looked fine, because it had no
    # data to contradict.
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

    # NO CREDENTIAL HERE, deliberately: /metrics is unauthenticated while
    # METRICS_TOKEN is unset, which is the case in development and staging.
    #
    # PRODUCTION IS A DIFFERENT FILE. app/main.py answers 404 when ENV=production
    # and METRICS_TOKEN is unset, and 401 without `Authorization: Bearer
    # $METRICS_TOKEN` when it is set, so this config would leave the target DOWN.
    # Use prometheus.production.yml, which adds bearer_token_file and nothing
    # else:
    #
    #   mkdir -p secrets && printf '%s' "$METRICS_TOKEN" > secrets/metrics_token
    #   chmod 644 secrets/metrics_token   # NOT 600 — see DEPLOYMENT.md
    #   PROMETHEUS_CONFIG=./prometheus.production.yml docker compose up -d
    #
    # The directive lives there rather than here because `promtool check config`
    # fails when bearer_token_file names a missing path, and the token file is
    # gitignored -- so putting it here would break the check on every fresh
    # clone. scripts/check_production_env.py verifies the production wiring.

  # The celery worker exports on its own port from the prefork parent. Without
  # this job, background jobs fail silently — nothing scraped them at all.
  - job_name: "celery"
    static_configs:
      - targets: ["celery_worker:9100"]
    metrics_path: /metrics

  # The outbox dispatcher. outbox_worker_heartbeat has been set on every poll
  # for as long as the worker has existed, with no job here to read it and no
  # HTTP server in that process to read it from -- unobservable rather than
  # merely unwatched.
  - job_name: "outbox_worker"
    static_configs:
      - targets: ["outbox_worker:9103"]
    metrics_path: /metrics

  # Prometheus scrapes itself so that `up` and process_* exist for rules that
  # check Prometheus's own liveness.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
