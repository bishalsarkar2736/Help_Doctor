# Alertmanager routing.
#
# Prometheus decides WHEN something is wrong; this decides WHO hears about it.
# Without this service the rules in alerts.yml evaluate and fire into nothing.
#
# Ships with an SMTP receiver pointed at the local MailHog container, so the
# whole path is exercised end to end locally and the result is readable in the
# MailHog UI on :8025. Replace the receivers with something that reaches a human
# before production — see docs/MONITORING.md and alertmanager.production.yml.

global:
  resolve_timeout: 5m

  # DEVELOPMENT SMTP -- MailHog, on the compose network. Production overrides all
  # of this in alertmanager.production.yml; nothing here reaches a real server.
  smtp_smarthost: "mailhog:1025"
  smtp_from: "alerts@helpdoctor.local"

  # Required, and counter-intuitive. MailHog's EHLO advertises only `auth` and
  # `pipelining` -- no STARTTLS -- so with Alertmanager's default of true every
  # send fails with "'require_tls' is true (default) but the server does not
  # advertise STARTTLS". Measured: 0 messages delivered with the flag omitted, 1
  # with it. This is a development-only relaxation; production keeps
  # smtp_require_tls: true against a real smarthost.
  smtp_require_tls: false

  # NO smtp_auth_username / smtp_auth_password HERE, deliberately.
  #
  # MailHog advertises `auth`, so adding credentials looks like hardening. It is
  # not: Go's SMTP client refuses PLAIN auth over an unencrypted connection, and
  # delivery breaks with "*smtp.plainAuth auth: unencrypted connection".
  # Measured, 0 messages delivered. MailHog accepts unauthenticated mail and
  # holds it locally, which is the whole point of it. Production authenticates
  # with a mounted secret file instead.

route:
  # Group by alertname so a flapping condition sends one notification thread
  # rather than one per evaluation.
  group_by: ["alertname", "severity"]

  # Wait briefly before the first notification so related alerts from the same
  # incident batch together (an API outage fires APIDown and HighAPILatency).
  group_wait: 30s
  group_interval: 5m

  # Do not re-send the same firing alert more often than this. Too short and
  # people mute the channel; too long and a real incident goes quiet.
  repeat_interval: 4h

  receiver: default

  routes:
    # THE DEAD-MAN'S SWITCH, and it must come first.
    #
    # Watchdog fires permanently by design (alerts.yml, group `watchdog`), so
    # the one thing that must never happen is for it to reach a human receiver:
    # a page that arrives every minute forever is how people learn to ignore
    # pages. This route matches it and stops -- `continue` defaults to false, so
    # no later route and not the default receiver ever sees it.
    #
    # It repeats every minute against an external monitor whose timeout is
    # measured in minutes, so the heartbeat is several times faster than the
    # window it has to beat. group_wait: 0s because batching a heartbeat only
    # delays it.
    - matchers:
        - severity = "watchdog"
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Critical alerts repeat more often and are not batched as long — these
    # are the "get out of bed" ones: the API is down, or money is being lost.
    - matchers:
        - severity = "critical"
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # When the API is down it will also be slow and failing. Suppress the
  # downstream noise so the page says one useful thing instead of five.
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - severity = "warning"
    equal: ["job"]

receivers:
  # Development delivers by SMTP to MailHog, which is what MailHog is for.
  #
  # These were webhook_configs posting to http://mailhog:8025/api/v2/messages,
  # and every notification failed with 404 -- 10 of 10 on this deployment,
  # including CeleryWorkerDown and OutboxWorkerDown. Port 8025 is MailHog's READ
  # api and web UI; it has no ingest endpoint at all. Measured: POST returns 404
  # on /api/v2/messages, /api/v1/messages, / and /webhook alike. So no webhook
  # URL could have worked -- the receiver type was wrong, not the address.
  #
  # Mail goes to port 1025 instead, and the delivery path is now genuinely
  # exercised locally: the message is visible in the MailHog UI at :8025.
  - name: default
    email_configs:
      - to: "oncall@helpdoctor.local"
        send_resolved: true

  - name: critical
    email_configs:
      - to: "oncall@helpdoctor.local"
        send_resolved: true

  # The dead-man's switch terminates here in development, deliberately with no
  # delivery configured at all.
  #
  # A receiver with no configs is valid (verified with amtool against the pinned
  # v0.33.1) and is the standard shape for a watchdog with no external monitor
  # attached -- it consumes the alert so nothing else routes it, and sends
  # nothing.
  #
  # WHY NOT url_file HERE, as production uses. Measured: amtool check-config
  # SUCCEEDS when the referenced file is absent, unlike Prometheus's
  # bearer_token_file which fails. So a dev config reading a secret would pass
  # validation on a fresh clone, start cleanly, and then fail every single send
  # at delivery time -- driving alertmanager_notifications_failed_total up and
  # firing AlertmanagerNotificationsFailing permanently. Development must work
  # with an empty ./secrets directory.
  #
  # WHY NOT an inline URL. There is no service in this compose file that accepts
  # a webhook: MailHog answers 404 to POST on every path (that mistake is
  # documented above), and adding a sink container would be new infrastructure
  # for a heartbeat that has nowhere real to go in development.
  #
  # To exercise the delivery path locally, run a sink on the compose network and
  # uncomment the block below -- this is what the throwaway Docker test does:
  #
  #   webhook_configs:
  #     - url: "http://sink:8080/ping"
  #       send_resolved: false
  #
  # Production is different and does deliver: see alertmanager.production.yml.
  - name: watchdog

# PRODUCTION — replace the receivers above with something that reaches a human.
# Credentials must come from a mounted secret, never inline in this committed
# file. Examples:
#
#   receivers:
#     - name: critical
#       email_configs:
#         - to: oncall@yourclinic.example
#           from: alerts@yourclinic.example
#           smarthost: smtp.example.com:587
#           auth_username: alerts@yourclinic.example
#           auth_password_file: /etc/alertmanager/secrets/smtp_password
#       slack_configs:
#         - api_url_file: /etc/alertmanager/secrets/slack_webhook
#           channel: "#oncall"
