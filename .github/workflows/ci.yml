name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Lint
        run: ruff check .

      # Formatting is checked but not enforced yet - the codebase needs a
      # one-time `ruff format` cleanup first. Flip to a plain `ruff format
      # --check .` (no continue-on-error) once that lands.
      - name: Format check (advisory)
        run: ruff format --check .
        continue-on-error: true

  # Dependency advisories against the PINNED requirements.txt, so this answers
  # "does anything we ship have a known CVE" rather than "is anything newer
  # available". Pinning without scanning is the trap: versions stay
  # reproducible, and reproducibly vulnerable, until someone looks.
  #
  # pip-audit is installed here rather than added to requirements.txt — the
  # scanner is not a runtime dependency and has no business in the image.
  #
  # No continue-on-error: a new advisory against anything we depend on should
  # fail the build. That is the entire point of the job.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # PYSEC-2026-1325 (ecdsa) is ignored deliberately and is the ONLY
      # accepted advisory:
      #
      #   * There is no fixed version. The python-ecdsa project considers side
      #     channel attacks out of scope, so this will never clear on its own.
      #   * It is transitive — pulled in by python-jose, imported by nothing in
      #     app/.
      #   * It is a Minerva timing attack on ECDSA *signing* over P-256. This
      #     application signs JWTs with HS256 (HMAC), so no ECDSA signing path
      #     is reachable. Signature verification is unaffected either way.
      #
      # Anything else must be FIXED, not added to this list. If a new advisory
      # appears here, upgrade the package; only add an ignore after establishing
      # that the vulnerable code path cannot be reached, and record why.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdoctor
          POSTGRES_PASSWORD: ci_ephemeral_not_a_secret
          POSTGRES_DB: hd_test
          TEST_POSTGRES_DB: hd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdoctor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # tests/conftest.py derives its connection from these POSTGRES_* values
      # (changing only the database name), so there is no separate credential
      # to keep in sync. These are throwaway values for an ephemeral service
      # container that exists only for the length of this job.
      #
      # Here the application database and the test database are deliberately
      # the same one, which conftest otherwise refuses — it drops the schema,
      # and on a workstation that would mean live patient data. Safe only
      # because this postgres is created for the job and destroyed with it.
      TEST_DB_IS_DISPOSABLE: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hd_test
      TEST_POSTGRES_DB: hd_test
      POSTGRES_USER: helpdoctor
      POSTGRES_PASSWORD: ci_ephemeral_not_a_secret
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Dummy values - the suite runs with TESTING=1 and never calls
      # these external services, but Settings requires them to load.
      JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      BKASH_BASE_URL: http://localhost/bkash
      BKASH_APP_KEY: test
      BKASH_APP_SECRET: test
      BKASH_USERNAME: test
      BKASH_PASSWORD: test
      BKASH_CALLBACK_URL: http://localhost/bkash/callback
      NAGAD_BASE_URL: http://localhost/nagad
      NAGAD_MERCHANT_ID: test
      NAGAD_PUBLIC_KEY: test
      NAGAD_PRIVATE_KEY: test
      NAGAD_CALLBACK_URL: http://localhost/nagad/callback
      ROCKET_BASE_URL: http://localhost/rocket
      ROCKET_MERCHANT_ID: test
      ROCKET_API_KEY: test
      ROCKET_CALLBACK_URL: http://localhost/rocket/callback
      BASE_URL: http://localhost:8000
      MAIL_HOST: localhost
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_FROM: noreply@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
